<svg width="100%" viewBox="0 0 680 160" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Shalini Tiwari – Frontend Developer profile banner</title>
  <desc>A beige banner showing name, role, and location</desc>

  <rect width="680" height="160" fill="#f5f0e8" rx="6"/>

  <!-- subtle dot grid texture -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#c8bfa8" opacity="0.5"/>
  </pattern>
  <rect width="680" height="160" fill="url(#dots)" rx="6"/>

  <!-- left accent bar -->
  <rect x="40" y="36" width="3" height="88" fill="#8c7a5e" rx="2"/>

  <!-- name -->
  <text x="58" y="76" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#2e2a22" letter-spacing="-0.5">Shalini Tiwari</text>

  <!-- role -->
  <text x="59" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#6b5f4d" letter-spacing="0.3">Frontend Developer  ·  React &amp; JavaScript</text>

  <!-- location + status row -->
  <text x="59" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8c7a5e" letter-spacing="0.2">Prayagraj, India</text>

  <!-- open to work pill -->
  <rect x="160" y="113" width="100" height="18" rx="9" fill="#ddd5c4"/>
  <circle cx="173" cy="122" r="3.5" fill="#5fcd6d"/>
  <text x="181" y="126" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#4a4236" letter-spacing="0.4">Open to work</text>

  <!-- right: initials circle -->
  <circle cx="608" cy="80" r="44" fill="#e8dfd0"/>
  <circle cx="608" cy="80" r="40" fill="none" stroke="#8c7a5e" stroke-width="1"/>
  <text x="608" y="88" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#5c4f3a" text-anchor="middle">ST</text>
</svg>
